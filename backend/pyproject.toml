[tool.poetry]
name = "kairos-bcp-backend"
version = "0.1.0"
description = "Kairos BCP Backend API - Personal Knowledge Management System"
authors = ["Kairos Team <team@kairos.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.scripts]
dev-setup = "scripts.dev_setup:main"
init-db = "scripts.init_db:main"
sample-data = "scripts.sample_data:main"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = ">=0.115.12,<0.116.0"
uvicorn = {extras = ["standard"], version = ">=0.34.3,<0.35.0"}
sqlalchemy = ">=2.0.41,<3.0.0"
asyncpg = ">=0.30.0,<0.31.0"
alembic = ">=1.16.1,<2.0.0"
pydantic = ">=2.11.6,<3.0.0"
pydantic-settings = ">=2.9.1,<3.0.0"
python-jose = {extras = ["cryptography"], version = ">=3.5.0,<4.0.0"}
passlib = {extras = ["bcrypt"], version = ">=1.7.4,<2.0.0"}
python-multipart = ">=0.0.20,<0.0.21"
python-dotenv = ">=1.1.0,<2.0.0"
email-validator = ">=2.2.0,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^1.0.0"
httpx = "^0.28.1"
aiosqlite = "^0.21.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"